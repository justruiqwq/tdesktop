name: HideSb Windows Build.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'Telegram/SourceFiles/tg_hidesb.**'
      - 'Telegram/SourceFiles/history/**'
      - '.github/workflows/hidesb-win.yml'

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      QT: "qt6"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free disk space.
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Write-Host ("C: free before: {0:N1} GB" -f $before)
          $paths = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Microsoft\Edge',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\Unity'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $after = (Get-PSDrive C).Free / 1GB
          Write-Host ("C: free after: {0:N1} GB (freed {1:N1} GB)" -f $after, ($after - $before))

      - name: Pick build drive.
        shell: pwsh
        run: |
          $drives = @()
          foreach ($d in 'D','C') {
            $drv = Get-PSDrive $d -ErrorAction SilentlyContinue
            if ($drv) {
              $free = [math]::Round($drv.Free / 1GB, 1)
              Write-Host ("{0}: free {1} GB" -f $d, $free)
              $drives += [pscustomobject]@{ Letter = $d; Free = $drv.Free }
            }
          }
          $best = ($drives | Sort-Object Free -Descending | Select-Object -First 1).Letter
          Write-Host "Chosen build drive: $best"
          "BUILD_DRIVE=$best" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare directories.
        shell: cmd
        run: |
          mkdir %BUILD_DRIVE%:\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %BUILD_DRIVE%:\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Skip breakpad dump_syms tool.
        shell: bash
        run: |
          PREP="$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"
          sed -i '/cd tools\\\\windows\\\\dump_syms/d' "$PREP"
          sed -i '/gyp dump_syms.gyp --format=msvs/d' "$PREP"
          sed -i '/msbuild -m dump_syms.vcxproj/d' "$PREP"
          echo "Patched prepare.py to skip dump_syms:"
          grep -n "dump_syms" "$PREP" || echo "  (no dump_syms references remain in win section)"

      - uses: ilammy/msvc-dev-cmd@v1
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-rel-v4-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-rel-v4-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact/

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: Telegram-HideSb-x64-Release
          path: artifact\
